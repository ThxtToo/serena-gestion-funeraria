
openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: service-requests
    description: Funeral service requests

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /service-requests:
    post:
      operationId: createServiceRequest
      tags: [service-requests]
      summary: Create a service request
      description: Creates a request for review; it does not confirm availability or the service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Request created and pending review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestCreated"
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /service-requests/{referenceCode}:
    get:
      operationId: getServiceRequest
      tags: [service-requests]
      summary: Consult a service request by reference
      description: Returns the current status of a request without exposing contact details.
      parameters:
        - name: referenceCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^SER-[A-Fa-f0-9]{10}$'
            
      responses:
        "200":
          description: Request found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestStatus"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CreateServiceRequest:
      type: object
      additionalProperties: false
      properties:
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactPhone:
          type: string
          minLength: 5
          maxLength: 30
        serviceType:
          type: string
          minLength: 2
          maxLength: 80
        requestedDate:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 1000
      required:
        - contactName
        - contactPhone
        - serviceType

    ServiceRequestCreated:
      type: object
      properties:
        referenceCode:
          type: string
        status:
          type: string
          const: pendiente
        message:
          type: string
      required:
        - referenceCode
        - status
        - message

    ServiceRequestStatus:
      type: object
      properties:
        referenceCode:
          type: string
        status:
          type: string
          enum:
            - pendiente
            - en_revision
            - confirmada
            - rechazada
            - cancelada
        message:
          type: string
      required:
        - referenceCode
        - status
        - message

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
