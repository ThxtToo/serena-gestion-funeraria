
openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: service-offerings
    description: Funeral service offering catalog
  - name: health
    description: Health operations
  - name: service-requests
    description: Funeral service requests
  - name: authentication
    description: Serena staff authentication and session management
  - name: employee-administration
    description: Administrator-only employee account management
  - name: service-request-management
    description: Staff review and status tracking of service requests
  - name: inventory
    description: Inventory items and stock movements
  - name: resources
    description: Operational resources and their assignment to requests
  - name: demo-policies
    description: Fictional policies used only for the academic demonstration
  - name: agent
    description: Serena assistant restricted to backend tools
  - name: contact-channels
    description: Human support channels used by the assistant

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /service-requests:
    post:
      operationId: createServiceRequest
      tags: [service-requests]
      summary: Create a service request
      description: Creates a request for review; it does not confirm availability or the service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Request created and pending review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestCreated"
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /service-requests/{referenceCode}:
    get:
      operationId: getServiceRequest
      tags: [service-requests]
      summary: Consult a service request by reference
      description: Returns the current status of a request without exposing contact details.
      parameters:
        - name: referenceCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^SER-[A-Fa-f0-9]{10}$'

      responses:
        "200":
          description: Request found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestStatus"
        "400":
          description: Invalid reference code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: login
      tags: [authentication]
      summary: Sign in to Serena
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials or inactive account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many sign-in attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [authentication]
      summary: Revoke the current session
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [authentication]
      summary: Return the current authenticated session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/password:
    patch:
      operationId: changePassword
      tags: [authentication]
      summary: Change the current user's password
      security:
        - SerenaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "400":
          description: Invalid input or current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/users:
    get:
      operationId: listEmployees
      tags: [employee-administration]
      summary: List employee accounts
      security:
        - SerenaSession: []
      responses:
        "200":
          description: Employee accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createEmployee
      tags: [employee-administration]
      summary: Create an employee account with a temporary password
      security:
        - SerenaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeInput"
      responses:
        "201":
          description: Employee created; the temporary password is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeCreateResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required or cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/users/{userId}/active:
    patch:
      operationId: setEmployeeActive
      tags: [employee-administration]
      summary: Activate or deactivate an employee account
      security:
        - SerenaSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEmployeeActiveInput"
      responses:
        "200":
          description: Employee status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeStatusResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required or cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /service-offerings:
    get:
      operationId: listPublicServiceOfferings
      tags: [service-offerings]
      summary: List active service offerings
      description: Returns active offerings available for public service requests.
      responses:
        "200":
          description: Active service offerings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOfferingList"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/service-offerings:
    get:
      operationId: listAdminServiceOfferings
      tags: [service-offerings]
      summary: List all service offerings
      description: Includes active and inactive offerings.
      security:
        - SerenaSession: []
      responses:
        "200":
          description: All service offerings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOfferingList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      operationId: createServiceOffering
      tags: [service-offerings]
      summary: Create a service offering
      security:
        - SerenaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceOfferingInput"
      responses:
        "201":
          description: Service offering created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOfferingResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required or cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An offering with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/service-offerings/{serviceOfferingId}:
    patch:
      operationId: updateServiceOffering
      tags: [service-offerings]
      summary: Update a service offering
      description: Updates its name, description, or active state. Does not delete historical requests.
      security:
        - SerenaSession: []
      parameters:
        - name: serviceOfferingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceOfferingInput"
      responses:
        "200":
          description: Service offering updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOfferingResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required or cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service offering not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An offering with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/service-requests:
    get:
      operationId: listServiceRequests
      tags: [service-request-management]
      summary: List service requests for staff review
      security:
        - SerenaSession: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pendiente
              - en_revision
              - confirmada
              - rechazada
              - cancelada
      responses:
        "200":
          description: Service requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestList"
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/service-requests/{serviceRequestId}:
    get:
      operationId: getServiceRequestDetail
      tags: [service-request-management]
      summary: Get one service request with its status history
      security:
        - SerenaSession: []
      parameters:
        - name: serviceRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Service request and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestDetail"
        "400":
          description: Invalid identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/service-requests/{serviceRequestId}/status:
    patch:
      operationId: updateServiceRequestStatus
      tags: [service-request-management]
      summary: Change the status of a service request
      description: Only transitions allowed by the documented state matrix are accepted. Rejections and cancellations require a reason.
      security:
        - SerenaSession: []
      parameters:
        - name: serviceRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequestStatusInput"
      responses:
        "200":
          description: Updated request and full history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestDetail"
        "400":
          description: Invalid transition or missing reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorized to change the status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/inventory-items:
    get:
      operationId: listInventoryItems
      tags: [inventory]
      summary: List inventory items
      security:
        - SerenaSession: []
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create an inventory item
      security:
        - SerenaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemInput"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An item with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/inventory-items/{inventoryItemId}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update an inventory item
      security:
        - SerenaSession: []
      parameters:
        - name: inventoryItemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryItemInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/inventory-items/{inventoryItemId}/movements:
    get:
      operationId: listInventoryMovements
      tags: [inventory]
      summary: List stock movements of an item
      security:
        - SerenaSession: []
      parameters:
        - name: inventoryItemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Movements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMovementList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createInventoryMovement
      tags: [inventory]
      summary: Register an entry, exit or adjustment
      description: Entries and exits are available to staff; adjustments require the administrator role and a reason.
      security:
        - SerenaSession: []
      parameters:
        - name: inventoryItemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryMovementInput"
      responses:
        "201":
          description: Movement registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMovementResult"
        "400":
          description: Invalid movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorized for this movement type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List operational resources
      description: When startAt and endAt are provided, each resource includes whether it is available for that period.
      security:
        - SerenaSession: []
      parameters:
        - name: startAt
          in: query
          required: false
          description: Inicio del período en formato ISO 8601.
          schema:
            type: string
        - name: endAt
          in: query
          required: false
          description: Fin del período en formato ISO 8601.
          schema:
            type: string
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
        "400":
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createResource
      tags: [resources]
      summary: Register an operational resource
      security:
        - SerenaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceInput"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A resource with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/resources/{resourceId}:
    patch:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource
      security:
        - SerenaSession: []
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceInput"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/resources/{resourceId}/assignments:
    get:
      operationId: listResourceAssignments
      tags: [resources]
      summary: List the assignments of one resource
      security:
        - SerenaSession: []
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceAssignmentList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/service-requests/{serviceRequestId}/assignments:
    get:
      operationId: listRequestAssignments
      tags: [resources]
      summary: List the resources assigned to a request
      security:
        - SerenaSession: []
      parameters:
        - name: serviceRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceAssignmentList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createResourceAssignment
      tags: [resources]
      summary: Assign a resource to a request for a period
      security:
        - SerenaSession: []
      parameters:
        - name: serviceRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceAssignmentInput"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceAssignmentResponse"
        "400":
          description: Invalid period or resource not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request or resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The resource is already assigned in that period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/resource-assignments/{assignmentId}/cancel:
    patch:
      operationId: cancelResourceAssignment
      tags: [resources]
      summary: Cancel an assignment, keeping its history
      security:
        - SerenaSession: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelResourceAssignmentInput"
      responses:
        "200":
          description: Assignment cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceAssignmentResponse"
        "400":
          description: The assignment is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/demo-policies/{policyCode}:
    get:
      operationId: getDemoPolicy
      tags: [demo-policies]
      summary: Look up a fictional demonstration policy
      description: Returns demonstration data only. It is not a real coverage check or an authorization from any insurer.
      security:
        - SerenaSession: []
      parameters:
        - name: policyCode
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 40
      responses:
        "200":
          description: Demonstration policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoPolicyResponse"
        "400":
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /agent/chat:
    post:
      operationId: agentChat
      tags: [agent]
      summary: Send a message to Serena's assistant
      description: The assistant can only use the backend tools it is authorized for. It never queries the database directly.
      security:
        - SerenaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentReply"
        "400":
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Password change required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The AI provider did not answer correctly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The assistant is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/contact-channels:
    get:
      operationId: listContactChannels
      tags: [contact-channels]
      summary: List configured human support channels
      security:
        - SerenaSession: []
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactChannelList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createContactChannel
      tags: [contact-channels]
      summary: Register a human support channel
      security:
        - SerenaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactChannelInput"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactChannelResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/contact-channels/{channelId}:
    patch:
      operationId: updateContactChannel
      tags: [contact-channels]
      summary: Update or deactivate a channel
      security:
        - SerenaSession: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactChannelInput"
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactChannelResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  securitySchemes:
    SerenaSession:
      type: apiKey
      in: cookie
      name: serena_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CreateServiceRequest:
      type: object
      additionalProperties: false
      properties:
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactPhone:
          type: string
          minLength: 5
          maxLength: 30
        serviceOfferingId:
          type: string
          format: uuid
        requestedDate:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 1000
      required:
        - contactName
        - contactPhone
        - serviceOfferingId

    ServiceRequestCreated:
      type: object
      properties:
        referenceCode:
          type: string
        status:
          type: string
          const: pendiente
        message:
          type: string
      required:
        - referenceCode
        - status
        - message

    ServiceRequestStatus:
      type: object
      properties:
        referenceCode:
          type: string
        status:
          type: string
          enum:
            - pendiente
            - en_revision
            - confirmada
            - rechazada
            - cancelada
        message:
          type: string
      required:
        - referenceCode
        - status
        - message

    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [administrador, empleado]
        mustChangePassword:
          type: boolean
      required: [id, email, fullName, role, mustChangePassword]

    AdminEmployee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [administrador, empleado]
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - email
        - fullName
        - role
        - isActive
        - mustChangePassword
        - createdAt
        - lastLoginAt

    AuthenticatedSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthenticatedUser"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [user, createdAt, expiresAt]

    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [email, password]

    ChangePasswordInput:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
      required: [currentPassword, newPassword]

    CreateEmployeeInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 2
          maxLength: 120
      required: [email, fullName]

    SetEmployeeActiveInput:
      type: object
      additionalProperties: false
      properties:
        isActive:
          type: boolean
      required: [isActive]

    LogoutResult:
      type: object
      properties:
        success:
          type: boolean
          const: true
      required: [success]

    EmployeeList:
      type: object
      properties:
        employees:
          type: array
          items:
            $ref: "#/components/schemas/AdminEmployee"
      required: [employees]

    EmployeeCreateResult:
      type: object
      properties:
        employee:
          $ref: "#/components/schemas/AdminEmployee"
        temporaryPassword:
          type: string
          minLength: 20
      required: [employee, temporaryPassword]

    EmployeeStatusResponse:
      type: object
      properties:
        employee:
          $ref: "#/components/schemas/AdminEmployee"
      required: [employee]

    ServiceOffering:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - isActive
        - createdAt
        - updatedAt

    ServiceOfferingList:
      type: object
      properties:
        serviceOfferings:
          type: array
          items:
            $ref: "#/components/schemas/ServiceOffering"
      required:
        - serviceOfferings

    CreateServiceOfferingInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 1000
      required:
        - name

    UpdateServiceOfferingInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 1000
        isActive:
          type: boolean

    ServiceOfferingResponse:
      type: object
      properties:
        serviceOffering:
          $ref: "#/components/schemas/ServiceOffering"
      required:
        - serviceOffering


    ServiceRequestSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceCode:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        serviceType:
          type: string
        serviceOfferingId:
          type: string
          format: uuid
          nullable: true
        requestedDate:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - pendiente
            - en_revision
            - confirmada
            - rechazada
            - cancelada
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - referenceCode
        - contactName
        - contactPhone
        - serviceType
        - status
        - createdAt
        - updatedAt

    ServiceRequestList:
      type: object
      properties:
        serviceRequests:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequestSummary"
      required:
        - serviceRequests

    ServiceRequestStatusHistoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        previousStatus:
          type: string
          nullable: true
          enum:
            - pendiente
            - en_revision
            - confirmada
            - rechazada
            - cancelada
        newStatus:
          type: string
          enum:
            - pendiente
            - en_revision
            - confirmada
            - rechazada
            - cancelada
        changedByUserId:
          type: string
          format: uuid
          nullable: true
        changedByName:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - newStatus
        - createdAt

    ServiceRequestDetail:
      type: object
      properties:
        serviceRequest:
          $ref: "#/components/schemas/ServiceRequestSummary"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequestStatusHistoryEntry"
      required:
        - serviceRequest
        - history

    UpdateServiceRequestStatusInput:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - en_revision
            - confirmada
            - rechazada
            - cancelada
        reason:
          type: string
          maxLength: 500
      required:
        - status

    InventoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        description:
          type: string
          nullable: true
        quantity:
          type: integer
        unit:
          type: string
        minimumQuantity:
          type: integer
        isActive:
          type: boolean
        lowStock:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - category
        - quantity
        - unit
        - minimumQuantity
        - isActive
        - lowStock
        - createdAt
        - updatedAt

    InventoryItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
      required:
        - items

    InventoryItemResponse:
      type: object
      properties:
        inventoryItem:
          $ref: "#/components/schemas/InventoryItem"
      required:
        - inventoryItem

    CreateInventoryItemInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        category:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          maxLength: 500
        unit:
          type: string
          minLength: 1
          maxLength: 30
        minimumQuantity:
          type: integer
          minimum: 0
          maximum: 100000
        initialQuantity:
          type: integer
          minimum: 0
          maximum: 100000
      required:
        - name
        - category
        - unit

    UpdateInventoryItemInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        category:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          maxLength: 500
        unit:
          type: string
          minLength: 1
          maxLength: 30
        minimumQuantity:
          type: integer
          minimum: 0
          maximum: 100000
        isActive:
          type: boolean

    InventoryMovement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inventoryItemId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - entrada
            - salida
            - ajuste
        quantity:
          type: integer
        previousQuantity:
          type: integer
        newQuantity:
          type: integer
        reason:
          type: string
          nullable: true
        performedByUserId:
          type: string
          format: uuid
          nullable: true
        performedByName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - inventoryItemId
        - type
        - quantity
        - previousQuantity
        - newQuantity
        - createdAt

    InventoryMovementList:
      type: object
      properties:
        movements:
          type: array
          items:
            $ref: "#/components/schemas/InventoryMovement"
      required:
        - movements

    CreateInventoryMovementInput:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - entrada
            - salida
            - ajuste
        quantity:
          type: integer
          minimum: 0
          maximum: 100000
        reason:
          type: string
          maxLength: 300
      required:
        - type
        - quantity

    InventoryMovementResult:
      type: object
      properties:
        inventoryItem:
          $ref: "#/components/schemas/InventoryItem"
        movement:
          $ref: "#/components/schemas/InventoryMovement"
      required:
        - inventoryItem
        - movement

    Resource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum:
            - sala
            - vehiculo
            - equipo
            - otro
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - disponible
            - mantenimiento
            - fuera_de_servicio
        available:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - status
        - available
        - createdAt
        - updatedAt

    ResourceList:
      type: object
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
      required:
        - resources

    ResourceResponse:
      type: object
      properties:
        resource:
          $ref: "#/components/schemas/Resource"
      required:
        - resource

    CreateResourceInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        type:
          type: string
          enum:
            - sala
            - vehiculo
            - equipo
            - otro
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum:
            - disponible
            - mantenimiento
            - fuera_de_servicio
      required:
        - name
        - type

    UpdateResourceInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum:
            - disponible
            - mantenimiento
            - fuera_de_servicio

    ResourceAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        serviceRequestId:
          type: string
          format: uuid
        referenceCode:
          type: string
        resourceId:
          type: string
          format: uuid
        resourceName:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - activa
            - finalizada
            - cancelada
        cancellationReason:
          type: string
          nullable: true
        assignedByName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - serviceRequestId
        - referenceCode
        - resourceId
        - resourceName
        - startAt
        - endAt
        - status
        - createdAt

    ResourceAssignmentList:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/ResourceAssignment"
      required:
        - assignments

    ResourceAssignmentResponse:
      type: object
      properties:
        assignment:
          $ref: "#/components/schemas/ResourceAssignment"
      required:
        - assignment

    CreateResourceAssignmentInput:
      type: object
      additionalProperties: false
      properties:
        resourceId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
      required:
        - resourceId
        - startAt
        - endAt

    CancelResourceAssignmentInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 300

    DemoPolicy:
      type: object
      properties:
        policyCode:
          type: string
        insurerName:
          type: string
        demoStatus:
          type: string
          enum:
            - vigente
            - vencida
            - suspendida
        isDemoData:
          type: boolean
        notice:
          type: string
      required:
        - policyCode
        - insurerName
        - demoStatus
        - isDemoData
        - notice

    DemoPolicyResponse:
      type: object
      properties:
        policy:
          $ref: "#/components/schemas/DemoPolicy"
      required:
        - policy

    AgentChatMessage:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - role
        - content

    AgentChatInput:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/AgentChatMessage"
      required:
        - messages

    AgentReply:
      type: object
      properties:
        reply:
          type: string
        toolsUsed:
          type: array
          items:
