
openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: service-offerings
    description: Funeral service offering catalog
  - name: health
    description: Health operations
  - name: service-requests
    description: Funeral service requests
  - name: authentication
    description: Serena staff authentication and session management
  - name: employee-administration
    description: Administrator-only employee account management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /service-requests:
    post:
      operationId: createServiceRequest
      tags: [service-requests]
      summary: Create a service request
      description: Creates a request for review; it does not confirm availability or the service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Request created and pending review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestCreated"
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /service-requests/{referenceCode}:
    get:
      operationId: getServiceRequest
      tags: [service-requests]
      summary: Consult a service request by reference
      description: Returns the current status of a request without exposing contact details.
      parameters:
        - name: referenceCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^SER-[A-Fa-f0-9]{10}$'

      responses:
        "200":
          description: Request found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestStatus"
        "400":
          description: Invalid reference code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: login
      tags: [authentication]
      summary: Sign in to Serena
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials or inactive account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many sign-in attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [authentication]
      summary: Revoke the current session
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [authentication]
      summary: Return the current authenticated session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/password:
    patch:
      operationId: changePassword
      tags: [authentication]
      summary: Change the current user's password
      security:
        - SerenaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "400":
          description: Invalid input or current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/users:
    get:
      operationId: listEmployees
      tags: [employee-administration]
      summary: List employee accounts
      security:
        - SerenaSession: []
      responses:
        "200":
          description: Employee accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createEmployee
      tags: [employee-administration]
      summary: Create an employee account with a temporary password
      security:
        - SerenaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeInput"
      responses:
        "201":
          description: Employee created; the temporary password is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeCreateResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required or cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/users/{userId}/active:
    patch:
      operationId: setEmployeeActive
      tags: [employee-administration]
      summary: Activate or deactivate an employee account
      security:
        - SerenaSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEmployeeActiveInput"
      responses:
        "200":
          description: Employee status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeStatusResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required or cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /service-offerings:
    get:
      operationId: listPublicServiceOfferings
      tags: [service-offerings]
      summary: List active service offerings
      description: Returns active offerings available for public service requests.
      responses:
        "200":
          description: Active service offerings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOfferingList"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/service-offerings:
    get:
      operationId: listAdminServiceOfferings
      tags: [service-offerings]
      summary: List all service offerings
      description: Includes active and inactive offerings.
      security:
        - SerenaSession: []
      responses:
        "200":
          description: All service offerings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOfferingList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      operationId: createServiceOffering
      tags: [service-offerings]
      summary: Create a service offering
      security:
        - SerenaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceOfferingInput"
      responses:
        "201":
          description: Service offering created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOfferingResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required or cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An offering with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/service-offerings/{serviceOfferingId}:
    patch:
      operationId: updateServiceOffering
      tags: [service-offerings]
      summary: Update a service offering
      description: Updates its name, description, or active state. Does not delete historical requests.
      security:
        - SerenaSession: []
      parameters:
        - name: serviceOfferingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceOfferingInput"
      responses:
        "200":
          description: Service offering updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOfferingResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator role required or cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service offering not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An offering with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  securitySchemes:
    SerenaSession:
      type: apiKey
      in: cookie
      name: serena_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CreateServiceRequest:
      type: object
      additionalProperties: false
      properties:
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactPhone:
          type: string
          minLength: 5
          maxLength: 30
        serviceOfferingId:
          type: string
          format: uuid
        requestedDate:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 1000
      required:
        - contactName
        - contactPhone
        - serviceOfferingId

    ServiceRequestCreated:
      type: object
      properties:
        referenceCode:
          type: string
        status:
          type: string
          const: pendiente
        message:
          type: string
      required:
        - referenceCode
        - status
        - message

    ServiceRequestStatus:
      type: object
      properties:
        referenceCode:
          type: string
        status:
          type: string
          enum:
            - pendiente
            - en_revision
            - confirmada
            - rechazada
            - cancelada
        message:
          type: string
      required:
        - referenceCode
        - status
        - message

    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [administrador, empleado]
        mustChangePassword:
          type: boolean
      required: [id, email, fullName, role, mustChangePassword]

    AdminEmployee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [administrador, empleado]
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - email
        - fullName
        - role
        - isActive
        - mustChangePassword
        - createdAt
        - lastLoginAt

    AuthenticatedSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthenticatedUser"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [user, createdAt, expiresAt]

    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [email, password]

    ChangePasswordInput:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
      required: [currentPassword, newPassword]

    CreateEmployeeInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 2
          maxLength: 120
      required: [email, fullName]

    SetEmployeeActiveInput:
      type: object
      additionalProperties: false
      properties:
        isActive:
          type: boolean
      required: [isActive]

    LogoutResult:
      type: object
      properties:
        success:
          type: boolean
          const: true
      required: [success]

    EmployeeList:
      type: object
      properties:
        employees:
          type: array
          items:
            $ref: "#/components/schemas/AdminEmployee"
      required: [employees]

    EmployeeCreateResult:
      type: object
      properties:
        employee:
          $ref: "#/components/schemas/AdminEmployee"
        temporaryPassword:
          type: string
          minLength: 20
      required: [employee, temporaryPassword]

    EmployeeStatusResponse:
      type: object
      properties:
        employee:
          $ref: "#/components/schemas/AdminEmployee"
      required: [employee]

    ServiceOffering:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - isActive
        - createdAt
        - updatedAt

    ServiceOfferingList:
      type: object
      properties:
        serviceOfferings:
          type: array
          items:
            $ref: "#/components/schemas/ServiceOffering"
      required:
        - serviceOfferings

    CreateServiceOfferingInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 1000
      required:
        - name

    UpdateServiceOfferingInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 1000
        isActive:
          type: boolean

    ServiceOfferingResponse:
      type: object
      properties:
        serviceOffering:
          $ref: "#/components/schemas/ServiceOffering"
      required:
        - serviceOffering


    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
